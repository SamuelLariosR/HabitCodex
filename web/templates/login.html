{% extends "base.html" %}

{% block titulo %}Iniciar sesión · HabitCodex{% endblock %}

{% block contenido %}
<h1>Iniciar sesión</h1>

{% if enlace %}
<section class="aviso-enlace">
  <p>Enlace de verificación simulado:</p>
  <p><a href="{{ enlace }}">{{ enlace }}</a></p>
</section>
{% endif %}

<form method="post" class="formulario">
  <label for="correo">Correo</label>
  <input id="correo" name="correo" type="text" required
         value="{{ correo|default('') }}">

  <label for="contrasena">Contraseña</label>
  <input id="contrasena" name="contrasena" type="password" required
         maxlength="16">

  <button type="submit">Entrar</button>
</form>

<p class="alternativa">
  ¿No tienes cuenta?
  <a href="{{ url_for('paginas.registro') }}">Crear cuenta</a>
</p>
{% endblock %}
