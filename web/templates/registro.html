{% extends "base.html" %}

{% block titulo %}Crear cuenta · HabitCodex{% endblock %}

{% block contenido %}
<h1>Crear cuenta</h1>

<form method="post" class="formulario">
  <label for="nombre">Nombre</label>
  <input id="nombre" name="nombre" type="text" required maxlength="60"
         value="{{ nombre|default('') }}">

  <label for="correo">Correo</label>
  <input id="correo" name="correo" type="text" required
         value="{{ correo|default('') }}">

  <label for="contrasena">Contraseña</label>
  <input id="contrasena" name="contrasena" type="password" required
         maxlength="16">
  <p class="ayuda">Entre 12 y 16 caracteres.</p>

  <button type="submit">Crear cuenta</button>
</form>

<p class="alternativa">
  ¿Ya tienes cuenta?
  <a href="{{ url_for('paginas.login') }}">Entrar</a>
</p>
{% endblock %}
